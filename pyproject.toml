[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-turing"
version = "0.1.0"
description = "JEV as a diode-like primitive: gates -> SR latch -> Rule 110 (offline, FakeJEV)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
png = ["Pillow>=10"]
dev = ["pytest>=8", "Pillow>=10", "numpy>=2"]
media = ["Pillow>=10", "numpy>=2"]  # media_ad soundtrack (ffmpeg also required)

[project.scripts]
jev-turing = "jev_turing.cli:main"

[tool.setuptools]
packages = ["jev_turing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
